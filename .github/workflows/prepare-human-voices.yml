name: Prepare human metronome voices

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/prepare-human-voices.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download real human recordings and prepare 80 WAV samples
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, urllib.parse, urllib.request, tarfile, shutil, sys

          ROOT = pathlib.Path("assets/voices")
          ROOT.mkdir(parents=True, exist_ok=True)
          TMP = pathlib.Path("/tmp/renax-human-voices")
          shutil.rmtree(TMP, ignore_errors=True)
          TMP.mkdir(parents=True)

          EN = ["one","two","three","four","five","six","seven","eight","nine","ten",
                "eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen",
                "eighteen","nineteen","twenty"]
          FR = ["un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix",
                "onze","douze","treize","quatorze","quinze","seize","dix-sept",
                "dix-huit","dix-neuf","vingt"]

          def get(url, dest):
              print("GET", url, flush=True)
              req = urllib.request.Request(url, headers={"User-Agent":"RENAX-DRUMS/2.6 human-audio-import"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  dest.write_bytes(r.read())

          def process(src, dest):
              dest.parent.mkdir(parents=True, exist_ok=True)
              # Keep the original human pitch/timing. Remove only leading room silence,
              # tame sub-bass, normalize spoken loudness, and preserve the natural ending.
              filt = (
                  "highpass=f=65,"
                  "silenceremove=start_periods=1:start_duration=0:start_threshold=-52dB:start_silence=0.001,"
                  "loudnorm=I=-18:TP=-1.5:LRA=10"
              )
              subprocess.run([
                  "ffmpeg","-hide_banner","-loglevel","error","-y",
                  "-i",str(src),"-vn","-ac","1","-ar","48000",
                  "-af",filt,"-c:a","pcm_s16le",str(dest)
              ], check=True)

          def commons_bank(bank, prefix, words):
              rawdir = TMP / bank
              rawdir.mkdir(parents=True, exist_ok=True)
              for n, word in enumerate(words, 1):
                  filename = prefix + word + ".wav"
                  url = "https://commons.wikimedia.org/wiki/Special:Redirect/file/" + urllib.parse.quote(filename, safe="")
                  raw = rawdir / f"{n:02d}-raw.wav"
                  get(url, raw)
                  process(raw, ROOT / bank / f"{n:02d}.wav")

          def freeswitch_bank(bank, release_tag, archive_name, words):
              archive = TMP / archive_name
              url = f"https://github.com/freeswitch/freeswitch-sounds/releases/download/{release_tag}/{archive_name}"
              get(url, archive)
              unpack = TMP / (bank + "-unpack")
              unpack.mkdir(parents=True, exist_ok=True)
              with tarfile.open(archive, "r:gz") as tf:
                  tf.extractall(unpack)
              files = list(unpack.rglob("*.wav"))
              for n, word in enumerate(words, 1):
                  # FreeSWITCH digits are named 1.wav ... 20.wav in the digits directory.
                  candidates = [p for p in files if p.name == f"{n}.wav" and "digits" in p.parts]
                  if not candidates:
                      raise RuntimeError(f"Missing FreeSWITCH digit {n} for {bank}")
                  process(candidates[0], ROOT / bank / f"{n:02d}.wav")

          # Male voices: real Lingua Libre speakers, CC0.
          commons_bank(
              "voice-men-en",
              "LL-Q1860 (eng)-Andre Vitor Kerr Lima (Andrevitorkerr)-",
              EN
          )
          commons_bank(
              "voix-homme-fr",
              "LL-Q150 (fra)-Ben (Mathsou)-",
              FR
          )

          # Female voices: professionally recorded FreeSWITCH prompt packs, MPL.
          freeswitch_bank(
              "voice-female-en",
              "en-us-callie-1.0.53",
              "freeswitch-sounds-en-us-callie-48000-1.0.53.tar.gz",
              EN
          )
          freeswitch_bank(
              "voix-femme-fr",
              "fr-ca-june-1.0.51",
              "freeswitch-sounds-fr-ca-june-48000-1.0.51.tar.gz",
              FR
          )

          # Structural QA: every bank must contain exactly 20 playable non-empty WAVs.
          banks = ["voice-men-en","voice-female-en","voix-homme-fr","voix-femme-fr"]
          for bank in banks:
              files = sorted((ROOT / bank).glob("*.wav"))
              if len(files) != 20:
                  raise RuntimeError(f"{bank}: expected 20 WAVs, got {len(files)}")
              for f in files:
                  if f.stat().st_size < 1000:
                      raise RuntimeError(f"{f}: suspiciously small")
                  subprocess.run(
                      ["ffprobe","-v","error","-show_entries","format=duration","-of","default=nw=1:nk=1",str(f)],
                      check=True, stdout=subprocess.DEVNULL
                  )

          (ROOT / "SOURCES.md").write_text("""# RENAX DRUMS — human metronome voice sources

These are **real human recordings**, not text-to-speech.

## Voice men EN
- Speaker: Andre Vitor Kerr Lima
- Project: Lingua Libre / Wikimedia Commons
- License: CC0 1.0
- Source filename pattern: `LL-Q1860 (eng)-Andre Vitor Kerr Lima (Andrevitorkerr)-<word>.wav`

## Voice female EN
- Voice: Callie
- Project: FreeSWITCH Sounds
- License: MPL (as distributed by the FreeSWITCH sounds project)
- Source package: `freeswitch-sounds-en-us-callie-48000-1.0.53.tar.gz`

## Voix homme FR
- Speaker: Ben
- Recorder: Mathsou
- Project: Lingua Libre / Wikimedia Commons
- License: CC0 1.0
- Source filename pattern: `LL-Q150 (fra)-Ben (Mathsou)-<mot>.wav`

## Voix femme FR
- Voice: June (French Canadian)
- Project: FreeSWITCH Sounds
- License: MPL (as distributed by the FreeSWITCH sounds project)
- Source package: `freeswitch-sounds-fr-ca-june-48000-1.0.51.tar.gz`

## RENAX processing
Each source is converted to mono PCM WAV at 48 kHz / 16-bit. Only leading silence is removed; the original pitch and speech timing are preserved. A light 65 Hz high-pass and loudness normalization are applied. No pitch shifting and no synthetic speech are used.
""", encoding="utf-8")
          PY

      - name: Commit human voice samples
        run: |
          git config user.name "RENAX DRUMS Audio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/voices
          git diff --cached --quiet && exit 0
          git commit -m "Add real human metronome voice samples"
          git push
